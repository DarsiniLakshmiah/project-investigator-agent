# Dependency-health policy for notebook-scoped installs (common/dependency_health.py).
#
# protected: packages owned by the Databricks runtime. A notebook-scoped install must not
# shadow them with a different version (that is what "changed the Databricks core
# protobuf version from 6.33.5 to 5.29.6" means). Shadowing a protected package fails
# the health check; shadowing any other package is reported (e.g. the Phase 6 pins of
# pydantic / python-dotenv, which are deliberate).
protected:
  - protobuf
  - grpcio
  - grpcio-status
  - googleapis-common-protos
  - databricks-sdk
  - mlflow-skinny
  - pyspark
  - py4j
  - numpy
  - pandas
  - pyarrow
  - torch
# Databricks serverless environment 6 (standard) baseline, from the Databricks release
# notes. Documentation only: the health check compares against what is actually
# installed, never against this list. Local test environments may resolve other versions
# (e.g. googleapis-common-protos 1.75.5 locally vs 1.71.0 in environment 6).
environment_6_baseline:
  python: "3.12.3"
  protobuf: "6.33.5"
  grpcio: "1.76.0"
  grpcio-status: "1.76.0"
  googleapis-common-protos: "1.71.0"
  databricks-sdk: "0.122.0"
  mlflow-skinny: "3.12.0"
  requests: "2.32.5"
  httpx: "0.28.1"
  pydantic: "2.13.3"
  pydantic_core: "2.46.3"
  PyYAML: "6.0.3"
  python-dotenv: "1.2.2"
# Environment 6 ML base additionally ships (used by notebook 07b).
environment_6_ml_additions:
  torch: "2.12.0+cpu"
  transformers: "4.57.6"
  sentence-transformers: "5.5.1"
# Versions printed in the health report (resolved environment record).
report:
  - protobuf
  - grpcio
  - grpcio-status
  - googleapis-common-protos
  - databricks-sdk
  - databricks-ai-search
  - mlflow-skinny
  - deprecation
  - requests
  - httpx
  - pydantic
  - pydantic_core
  - PyYAML
  - python-dotenv
  - openpyxl
  - pypdfium2
  - sentence-transformers
  - transformers
  - torch
