# Interview-prototype runtime for copilot.investigate(query, project_id).
# Separate from the pinned environment/routing/retrieval configs, which stay frozen.
# Environment overrides: WBC_COPILOT_INVESTIGATOR_ENDPOINT, WBC_COPILOT_SYNTHESIZER_ENDPOINT,
# WBC_COPILOT_CRITIC_ENDPOINT, WBC_COPILOT_CRITIC_ENABLED (true/false).

models:
  investigator_endpoint: databricks-qwen35-122b-a10b
  synthesizer_endpoint: databricks-qwen35-122b-a10b
  critic_endpoint: databricks-qwen35-122b-a10b
  # Fail-closed when enabled; when disabled, results record critic_status DISABLED.
  critic_enabled: true
  # Raised from 2000 after real S2 run: FINISH_REASON_LENGTH (output truncated at the ceiling).
  max_output_tokens: 5000
  timeout_seconds: 60
  # Shown with every model-generated answer; never presented as capability acceptance.
  capability_note: >-
    Phase 10D attempt 10d7 (lock @4): databricks-qwen35-122b-a10b passed 12/19 calls
    (overall FAIL). It is not capability-accepted; deterministic validation is
    authoritative for every published claim.

investigation:
  # Bounded Investigator: at most 2 decision rounds and 6 governed tool/retrieval calls.
  max_decision_rounds: 2
  max_tool_calls: 6
  # Relevance-aware packing: round-robin over calls in ranked order, long text trimmed.
  context_max_bytes: 40000
  evidence_text_chars: 1500

projects:
  allowed: [P130544, P179039, P506272]

policy:
  # Request deadline; model calls and tool calls are bounded under investigation:.
  # Billed cost is not exposed by the platform adapters (UNAVAILABLE, not zero).
  overall_deadline_seconds: 180

mlflow:
  experiment: null
