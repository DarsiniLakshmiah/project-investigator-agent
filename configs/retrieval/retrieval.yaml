# Retrieval configuration (Phase 8).
vector_search:
  # Databricks AI Search (Vector Search). This workspace allows ONE endpoint (quota hit
  # when creating 'worldbank-copilot-vs'), so the existing ONLINE endpoint is reused.
  # It also serves the earlier GEP project's indexes (worldbank_ai.rag.*); this project
  # only adds its own, independently named index and never modifies or deletes others.
  endpoint: worldbank-gep-ai-search
  create_endpoint: false                     # never create or modify an endpoint
  index_table: document_chunk_index          # <catalog>.silver.<index_table> (index source)
  # <catalog>.silver.<index_name>: this project's index (Qwen3 0.6B vectors, dim 1024).
  index_name: document_chunk_index_qwen3_v1
  pipeline_type: TRIGGERED
  sync_timeout_seconds: 1800
  query_timeout_seconds: 30
lexical:
  k1: 1.5
  b: 0.75
hybrid:
  rrf_k: 60
reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_length: 512
  batch_size: 32
# Filters every query must carry. Retrieval without project scope is refused.
required_filters: [project_id]
# Abstention: with a reranker, return INSUFFICIENT_EVIDENCE when the best rerank score
# is below this value (calibrated on the no-answer evaluation questions; see
# evaluation report). Without a reranker, abstain only when nothing is retrieved.
min_rerank_score: null
# Selected production configuration. Set from the Phase 8 experiment results.
production:
  chunk_strategy: null
  retrieval: null
  reranker: null
  candidate_k: null
  final_k: 5
