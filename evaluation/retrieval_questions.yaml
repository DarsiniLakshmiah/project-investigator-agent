# Phase 8 retrieval evaluation set.
#
# Ground truth comes from the source documents (Phase 4 parsed text) and validated Phase
# 5 Silver facts; it was NOT produced by the retrieval system. Every evidence item names
# a document, the PDF page(s) and a short verbatim phrase. tests/unit/test_retrieval_
# questions.py checks that each phrase really occurs on those pages of that document.
#
# A retrieved chunk is RELEVANT to an evidence item when it comes from the same document,
# shares at least one page, and its text contains the phrase (case/whitespace-insensitive).
# evidence_mode: all = every item is needed (multi-evidence); any = one item answers it
# (the same statement repeated in several reports).
# answerable: false = the corpus holds no answer (used to calibrate abstention; excluded
# from ranking metrics).

