# Phase 9C routing evaluation dataset - HUMAN-REVIEWED LABELS, split FROZEN (2026-10-01).
#
# These labels state what the system SHOULD do (semantic ground truth), not what the
# deterministic router does. Router output is measured separately and never written here:
#   evaluation/routing_baseline_9B.1.yaml - original 9B router (before the r073 fix)
#   evaluation/routing_baseline_9B.2.yaml - router 9B.2, against these reviewed labels
# and compared in evaluation/routing_review_9c.md. The router must not be tuned against
# these labels; disagreements are measured baseline errors or semantic-classification gaps.
#
# Phase 8 retrieval labels (evaluation/retrieval_questions.yaml) are NOT changed and do
# NOT define routing labels; phase8_ref only links the question.
#
# family = split group: near-duplicate questions and questions sharing the same
# underlying evidence stay in the same split (no dev/test leakage). 29 dev / 51 test.
#
# expected.tools lists key arguments only (must-include subset). Temporal: kind + explicit
# (explicit=false means the time is an intent default the user did not state); RELATIVE
# scopes carry the governed as-of date and the resolved interval.
version: 1
review_status: REVIEWED
reviewed_on: 2026-10-01
split_status: FROZEN        # 29 dev / 51 test, approved 2026-10-01; do not rebalance
semantic_rules:
  - '1. Named/source-document wording requiring what that document says -> DOCUMENT.'
  - '2. Governed factual value/query that can be answered deterministically -> STRUCTURED.'
  - '3. Documented rationale for an already uniquely identified event/change -> DOCUMENT / EXPLANATION.'
  - '4. A ''why'' question where the system must first establish the underlying change/state/event -> INVESTIGATION.'
  - '5. Ambiguous project/entity/time references are resolved or clarified before execution; never guessed.'
  - '6. Broad current-state questions default to PROJECT_OVERVIEW; attention signals are not equivalent to overall project status.'
  - '7. Relative temporal scopes use a governed reproducible as-of date, not uncontrolled wall-clock time.'
cases:
